<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setter Cockpit | RevOps Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --color-bg-dark: #223129;
        --color-box-translucent: rgba(255, 255, 255, 0.05);
        --color-border-deep: #1E5E3F;
        --color-sage-accent: #4C9170;
        --color-mint-soft: #8DC4AA;
        --color-white: #ffffff;
        --text-on-dark: #f8fafc;
        --text-on-light: #1e293b;
        --gold-accent: #D9A441;
        --gold-dim: rgba(217,164,65,0.14);
        --focus-glow: rgba(76, 145, 112, 0.2);
        --shadow-soft: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    body.theme-executive {
        --color-bg-dark: hsl(210, 15%, 12%);
        --color-box-translucent: rgba(255,255,255,0.03);
        --color-sage-accent: hsl(259, 30%, 42%);
        --color-mint-soft: hsl(259, 15%, 70%);
        --gold-accent: hsl(180, 60%, 50%);
        --gold-dim: hsla(180, 60%, 50%, 0.1);
        --focus-glow: rgba(90, 74, 140, 0.2);
        --shadow-soft: 0 10px 25px -5px rgba(0,0,0,0.2), 0 8px 10px -6px rgba(0,0,0,0.1);
    }
    body.theme-executive .btn-primary { box-shadow: 0 2px 6px rgba(90,74,140,0.35); }
    body.theme-executive .btn-primary:hover { box-shadow: 0 3px 8px rgba(90,74,140,0.45); }
    body.theme-executive .btn-transaction { box-shadow: 0 2px 6px rgba(0,204,204,0.25); }
    body.theme-executive .btn-transaction:hover { box-shadow: 0 3px 8px rgba(0,204,204,0.35); }

    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 0;
        font-family: 'Manrope', system-ui, -apple-system, sans-serif;
        background: var(--color-bg-dark);
        color: var(--text-on-dark);
        min-height: 100vh;
    }
    h1, h2 { font-family: 'Fraunces', serif; }
    h2 {
        margin-top: 0; margin-bottom: 20px;
        font-size: 19px; font-weight: 500; letter-spacing: -0.01em;
        color: var(--color-mint-soft);
        border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 10px;
    }
    #app-content { flex-direction: column; align-items: center; }

    #setter-pane { max-width: 640px; margin: 0 auto; padding: 40px 24px 24px; width: 100%; }

    .form-section {
        background: var(--color-box-translucent); padding: 24px;
        border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 25px;
    }
    .grid-2 { display: flex; gap: 15px; margin-bottom: 18px; }
    .grid-2 .form-group { flex: 1; margin-bottom: 0; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 11px; text-transform: uppercase; color: var(--color-mint-soft); letter-spacing: 0.5px; }

    input, select, textarea {
        width: 100%; padding: 12px; border-radius: 8px; font-size: 14px;
        font-family: inherit; transition: all 0.2s; box-sizing: border-box;
    }
    #setter-pane input, #setter-pane select, #setter-pane textarea {
        border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.15); color: #ffffff;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--color-sage-accent); outline: none; box-shadow: 0 0 0 3px var(--focus-glow); }
    textarea { min-height: 70px; resize: vertical; }

    .multiselect-container { position: relative; width: 100%; z-index: 10; }
    .multiselect-container.active { z-index: 9999; }
    .select-display-box {
        width: 100%; padding: 12px; border-radius: 8px;
        font-size: 14px; cursor: pointer;
        display: flex; justify-content: space-between; align-items: center; box-sizing: border-box;
        border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.15); color: #ffffff;
    }
    .checkbox-dropdown-window {
        display: none; position: absolute; top: 100%; left: 0; width: 100%;
        border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
        z-index: 9999; max-height: 240px; overflow-y: auto; padding: 8px; margin-top: 4px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); box-sizing: border-box;
        background: #1e293b;
    }
    .checkbox-dropdown-window label {
        display: flex; align-items: center; gap: 10px; font-weight: 500; text-transform: none;
        color: #f8fafc; padding: 8px 10px; cursor: pointer; letter-spacing: normal; margin: 0; font-size: 14px; border-radius: 4px;
    }
    .checkbox-dropdown-window label:hover { background: rgba(255,255,255,0.1); }
    .checkbox-dropdown-window input[type="checkbox"] { width: auto; margin: 0; cursor: pointer; }

    .btn-primary {
        width: 100%; background: var(--color-sage-accent); color: white; border: none;
        padding: 16px; font-size: 15px; font-weight: 700; border-radius: 8px; cursor: pointer;
        transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px;
    }
    .btn-primary:hover:not(:disabled) { background: #3d7a5c; transform: translateY(-1px); }
    .btn-primary:active:not(:disabled) { transform: translateY(1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-transaction { font-family: 'Manrope', sans-serif; font-weight: 700; letter-spacing: 1px; }
    .btn-logout {
        background: var(--color-sage-accent); color: #ffffff; border: none; padding: 9px 20px;
        font-size: 11px; font-weight: 700; border-radius: 7px; cursor: pointer; text-transform: uppercase;
        letter-spacing: 0.5px; transition: background 0.15s; flex-shrink: 0;
    }
    .btn-logout:hover { background: #3d7a5c; }

    #status-msg { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }

    .theme-toggle-wrapper {
        max-width: 640px; width: 100%; margin: 0 auto; padding: 20px 24px 40px;
        border-top: 1px solid rgba(255,255,255,0.1);
        display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .logged-in-block { display: flex; align-items: center; gap: 12px; }
    .theme-toggle { display: flex; background: rgba(255,255,255,0.1); border-radius: 20px; padding: 3px; gap: 2px; }
    .theme-toggle button {
        border: none; background: transparent; color: var(--text-on-dark); padding: 6px 14px;
        border-radius: 16px; font-size: 11px; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.5px; cursor: pointer; transition: background 0.15s; font-family: inherit;
    }
    .theme-toggle button.active { background: var(--color-sage-accent); color: #fff; }
</style>
</head>
<body>

<div id="login-gate" style="display:flex; align-items:center; justify-content:center; height:100vh; width:100vw; position:fixed; top:0; left:0; background:var(--color-bg-dark); z-index:1000;">
    <div style="background:var(--color-box-translucent); border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:30px; width:320px; box-shadow:var(--shadow-soft);">
        <h2 style="margin-top:0;">Setter Login</h2>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="login-email" placeholder="you@company.com" onkeydown="if(event.key==='Enter') attemptLogin()">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="••••••••" onkeydown="if(event.key==='Enter') attemptLogin()">
        </div>
        <button type="button" class="btn-primary" onclick="attemptLogin()">Log In</button>
        <div id="login-error" style="margin-top:10px; font-size:12px; color:#ef4444;"></div>
        <div style="margin-top:10px;">
            <a href="#" onclick="sendCockpitResetEmail(); return false;" style="color: var(--color-mint-soft); font-size:12px;">Forgot password?</a>
        </div>
    </div>
</div>

<div id="force-reset-gate" style="display:none; align-items:center; justify-content:center; height:100vh; width:100vw; position:fixed; top:0; left:0; background:var(--color-bg-dark); z-index:1000;">
    <div style="background:var(--color-box-translucent); border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:30px; width:320px; box-shadow:var(--shadow-soft);">
        <h2 style="margin-top:0;">Set Your Password</h2>
        <p style="font-size:13px; opacity:0.75; margin-top:-6px;">This is your first login — set a password only you know before continuing.</p>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" id="reset-new-password" placeholder="8+ chars, incl. a letter, number & symbol" onkeydown="if(event.key==='Enter') attemptForcedReset()">
        </div>
        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="reset-confirm-password" placeholder="••••••••" onkeydown="if(event.key==='Enter') attemptForcedReset()">
        </div>
        <button type="button" class="btn-primary" onclick="attemptForcedReset()">Set Password &amp; Continue</button>
        <div id="reset-error" style="margin-top:10px; font-size:12px; color:#ef4444;"></div>
    </div>
</div>

<div id="app-content" style="display:none;">
    <div id="setter-pane">
        <h2>New Lead Intake</h2>
        <div class="form-section">
            <div class="grid-2">
                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" id="setter-customer-name" placeholder="Full name">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="setter-customer-phone" placeholder="(555) 555-5555" oninput="this.value = this.value.replace(/\D/g, '').slice(0, 12); validateSubmitState();">
                </div>
            </div>

            <div class="form-group">
                <label>Address</label>
                <input type="text" id="setter-address-input" placeholder="Start typing an address...">
            </div>

            <div class="form-group">
                <label>Service Area Check</label>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="setter-zip-input" placeholder="Zip code" maxlength="5" inputmode="numeric"
                        oninput="this.value = this.value.replace(/\D/g, '').slice(0, 5); resetZipEligibilityState();"
                        style="flex:1;">
                    <button type="button" class="btn-primary btn-transaction" id="btn-check-eligibility" onclick="handleCheckZipEligibility()"
                        style="width:auto; padding-left:20px; padding-right:20px; margin-top:0;">Check Eligibility</button>
                </div>
                <div id="zip-eligibility-status" style="font-size:13px; font-weight:700; margin-top:8px; min-height:18px;"></div>
            </div>

            <div class="form-group">
                <label>Pest / Service Interest</label>
                <div class="multiselect-container" id="setter-pest-dropdown-wrapper">
                    <div class="select-display-box" onclick="toggleSetterPestDropdown(event)">
                        <span id="setter-display-selected-text">-- Select Active Infestations --</span> <span>▼</span>
                    </div>
                    <div class="checkbox-dropdown-window" id="setter-dropdown-checkbox-panel">
                        <label><input type="checkbox" class="setter-pest-cb" value="General Pests" onchange="updateSetterPestDisplayText()"> General Pests</label>
                        <label><input type="checkbox" class="setter-pest-cb" value="Ticks, Fleas, Mosquitos" onchange="updateSetterPestDisplayText()"> Ticks, Fleas, Mosquitos</label>
                        <label><input type="checkbox" class="setter-pest-cb" value="German Roaches" onchange="updateSetterPestDisplayText()"> German Roaches</label>
                        <label><input type="checkbox" class="setter-pest-cb" value="Interior Rodent" onchange="updateSetterPestDisplayText()"> Interior Rodent</label>
                        <label><input type="checkbox" class="setter-pest-cb" value="Exterior Rodent" onchange="updateSetterPestDisplayText()"> Exterior Rodent</label>
                        <label><input type="checkbox" class="setter-pest-cb" value="Mole" onchange="updateSetterPestDisplayText()"> Mole</label>
                        <label><input type="checkbox" class="setter-pest-cb" value="Carpenter Bees" onchange="updateSetterPestDisplayText()"> Carpenter Bees</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Notes</label>
                <textarea id="setter-notes" placeholder="Anything the closer should know before picking up"></textarea>
            </div>

            <div id="qualified-buttons" style="display:flex; gap:10px;">
                <button type="button" class="btn-primary btn-transaction" id="btn-live-transfer" onclick="handleQualifiedSubmit('live')" style="flex:1;" disabled>Live Transfer</button>
                <button type="button" class="btn-primary btn-transaction" id="btn-callback-queue" onclick="handleQualifiedSubmit('queue')" style="flex:1;" disabled>Callback Queue</button>
            </div>

            <div class="form-group" style="margin-top:18px;">
                <label>Unqualified Reason</label>
                <select id="unqualified-reason-select" onchange="validateSubmitState()">
                    <option value="">-- Select if not qualified --</option>
                    <option value="Out of Area">Out of Area</option>
                    <option value="Unqualified Pest">Unqualified Pest</option>
                    <option value="Robocall">Robocall</option>
                    <option value="Current Customer">Current Customer</option>
                    <option value="Unqualified Property">Unqualified Property</option>
                    <option value="Non-English Speaker">Non-English Speaker</option>
                    <option value="Call Issue">Call Issue</option>
                </select>
            </div>

            <button type="button" id="btn-unqualified-submit" onclick="handleUnqualifiedSubmit()"
                style="display:none; width:100%; background:#b91c1c; color:#fff; border:none; padding:16px; font-size:15px; font-weight:700; border-radius:8px; cursor:pointer; text-transform:uppercase; letter-spacing:1px; margin-top:10px; font-family:inherit;" disabled>
                Unqualified: Submit Call
            </button>
            <div id="status-msg"></div>
        </div>
    </div>

    <div class="theme-toggle-wrapper">
        <div class="logged-in-block">
            <div>
                <label style="margin:0;">Logged in as</label>
                <div id="logged-in-rep-display" style="font-size:15px; font-weight:600; color:#fff; font-family:'Fraunces',serif;">—</div>
            </div>
            <button type="button" class="btn-logout" onclick="attemptLogout()">Log Out</button>
        </div>
        <div class="theme-toggle">
            <button type="button" id="theme-btn-dark" onclick="setScriptPaneTheme('dark')">Green</button>
            <button type="button" id="theme-btn-executive" onclick="setScriptPaneTheme('executive')">Executive</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAdT027lWYDDB6Ab58_h0JfvnehSt8UPF0&libraries=places&loading=async" async defer></script>
<script src="https://jitneylogic.github.io/jitney-demo-setter/jitneylogic-engine-setter.js?v=13"></script>
<script>
    window.JITNEYLOGIC_CONFIG = {
        clientId: "demo-pest-co",
        leadsUrl: "https://jitneyleads-889415757227.us-central1.run.app/",
        adminUrl: "https://jitneyadmin-889415757227.us-central1.run.app/",
        firebaseConfig: {
            apiKey: "AIzaSyDkWrGWcepdHlkzkeSGWLiIrV0Kxsul4nE",
            authDomain: "jitneylogic-beta.firebaseapp.com",
            projectId: "jitneylogic-beta",
            storageBucket: "jitneylogic-beta.firebasestorage.app",
            messagingSenderId: "889415757227",
            appId: "1:889415757227:web:9e54a600eb654bb30276ee",
            measurementId: "G-4JECF3BX6E"
        }
    };

    function toggleSetterPestDropdown(event) {
        event.stopPropagation();
        const panel = document.getElementById('setter-dropdown-checkbox-panel');
        const wrapper = document.getElementById('setter-pest-dropdown-wrapper');
        if (panel.style.display === 'block') {
            panel.style.display = 'none';
            wrapper.classList.remove('active');
        } else {
            panel.style.display = 'block';
            wrapper.classList.add('active');
        }
    }

    function updateSetterPestDisplayText() {
        const checked = Array.from(document.querySelectorAll('.setter-pest-cb:checked')).map(cb => cb.value);
        const el = document.getElementById('setter-display-selected-text');
        el.innerText = checked.length > 0 ? checked.join(', ') : '-- Select Active Infestations --';
    }

    window.addEventListener('click', function (event) {
        const wrapper = document.getElementById('setter-pest-dropdown-wrapper');
        const panel = document.getElementById('setter-dropdown-checkbox-panel');
        if (wrapper && panel && !wrapper.contains(event.target) && panel.style.display === 'block') {
            panel.style.display = 'none';
            wrapper.classList.remove('active');
        }
    });

    let zipEligibleState = null; 

    function resetZipEligibilityState() {
        zipEligibleState = null;
        document.getElementById('zip-eligibility-status').innerText = '';
    }

    async function handleCheckZipEligibility() {
        const zip = document.getElementById('setter-zip-input').value.trim();
        const statusEl = document.getElementById('zip-eligibility-status');
        if (!/^\d{5}$/.test(zip)) {
            statusEl.innerText = 'Enter a 5-digit zip code.';
            statusEl.style.color = '#ef4444';
            return;
        }
        statusEl.innerText = 'Checking...';
        statusEl.style.color = 'var(--color-mint-soft)';
        try {
            const eligible = await fireCheckZipEligibility(zip);
            zipEligibleState = eligible;
            if (eligible) {
                statusEl.innerText = '✓ Qualified — in service area';
                statusEl.style.color = 'var(--color-sage-accent)';
            } else {
                statusEl.innerText = '✗ Out of service area';
                statusEl.style.color = '#ef4444';
                document.getElementById('unqualified-reason-select').value = 'Out of Area';
                validateSubmitState();
            }
        } catch (err) {
            zipEligibleState = null;
            statusEl.innerText = err.message;
            statusEl.style.color = '#ef4444';
        }
    }

    window.onAddressSelected = function (components) {
        if (components && components.zip) {
            document.getElementById('setter-zip-input').value = components.zip;
            handleCheckZipEligibility();
        }
    };

    function readLeadFromForm() {
        return {
            customerName: document.getElementById('setter-customer-name').value.trim(),
            customerPhone: document.getElementById('setter-customer-phone').value.replace(/\D/g, '').trim(),
            address: document.getElementById('setter-address-input').value.trim(),
            pestTypes: Array.from(document.querySelectorAll('.setter-pest-cb:checked')).map(cb => cb.value),
            notes: document.getElementById('setter-notes').value.trim()
        };
    }

    function clearForm() {
        document.getElementById('setter-customer-name').value = '';
        document.getElementById('setter-customer-phone').value = '';
        document.getElementById('setter-address-input').value = '';
        document.getElementById('setter-zip-input').value = '';
        resetZipEligibilityState();
        document.querySelectorAll('.setter-pest-cb').forEach(cb => cb.checked = false);
        updateSetterPestDisplayText();
        document.getElementById('setter-notes').value = '';
        document.getElementById('unqualified-reason-select').value = '';
        validateSubmitState(); 
    }

    function isValidPhoneLength(phone) {
        return phone.length >= 10 && phone.length <= 12;
    }

    function validateSubmitState() {
        const hasReason = !!document.getElementById('unqualified-reason-select').value;
        
        document.getElementById('btn-live-transfer').style.opacity = hasReason ? '0.4' : '1';
        document.getElementById('btn-callback-queue').style.opacity = hasReason ? '0.4' : '1';
        
        document.getElementById('btn-live-transfer').disabled = hasReason;
        document.getElementById('btn-callback-queue').disabled = hasReason;
        
        const unqualBtn = document.getElementById('btn-unqualified-submit');
        unqualBtn.style.display = hasReason ? 'block' : 'none';
        unqualBtn.disabled = !hasReason;
    }

    function setButtonsDisabled(disabled) {
        document.getElementById('btn-live-transfer').disabled = disabled;
        document.getElementById('btn-callback-queue').disabled = disabled;
        document.getElementById('btn-unqualified-submit').disabled = disabled;
    }

    async function handleQualifiedSubmit(transferType) {
        const lead = readLeadFromForm();
        if (!lead.customerName || !lead.customerPhone) {
            showStatus("Name and phone are required before submitting.", true);
            return;
        }
        if (!isValidPhoneLength(lead.customerPhone)) {
            alert("Phone number must be 10-12 digits.");
            return;
        }
        if (lead.pestTypes.length === 0) {
            showStatus("Select at least one pest/service before submitting.", true);
            return;
        }
        if (!lead.notes) {
            showStatus("Notes are required before submitting a qualified lead.", true);
            return;
        }
        if (zipEligibleState !== true) {
            showStatus("Check zip eligibility before submitting a qualified lead.", true);
            return;
        }
        lead.qualified = true;
        setButtonsDisabled(true);
        showStatus("Submitting...", false);
        try {
            await fireSubmitLead(lead, transferType);
            showStatus(transferType === "live" ? "Sent — live transfer queue." : "Sent — callback queue.", false);
            clearForm();
        } catch (err) {
            showStatus(err.message, true);
        } finally {
            validateSubmitState();
        }
    }

    async function handleUnqualifiedSubmit() {
        const lead = readLeadFromForm();
        const reason = document.getElementById('unqualified-reason-select').value;
        if (!lead.customerName || !lead.customerPhone) {
            showStatus("Name and phone are required before submitting.", true);
            return;
        }
        if (!isValidPhoneLength(lead.customerPhone)) {
            alert("Phone number must be 10-12 digits.");
            return;
        }
        if (!reason) {
            showStatus("Select an unqualified reason first.", true);
            return;
        }
        lead.qualified = false;
        lead.unqualifiedReason = reason;
        setButtonsDisabled(true);
        showStatus("Recording as unqualified...", false);
        try {
            await fireSubmitLead(lead, "queue");
            showStatus("Recorded as unqualified — not sent to the closer queue.", false);
            clearForm();
        } catch (err) {
            showStatus(err.message, true);
        } finally {
            validateSubmitState();
        }
    }

    function showStatus(msg, isError) {
        const el = document.getElementById('status-msg');
        el.innerText = msg;
        el.style.color = isError ? "#ef4444" : "var(--color-mint-soft)";
    }

    function startAppAfterLogin() {
        document.getElementById('logged-in-rep-display').innerText = getRepName() || '';
        initAddressAutocomplete(['setter-address-input']);
    }

    function setScriptPaneTheme(mode) {
        document.body.classList.toggle('theme-executive', mode === 'executive');
        document.getElementById('theme-btn-dark').classList.toggle('active', mode === 'dark');
        document.getElementById('theme-btn-executive').classList.toggle('active', mode === 'executive');
        localStorage.setItem('jitneylogic_script_pane_theme', mode);
        if (window.syncThemePreference) window.syncThemePreference(mode);
    }
    window.setScriptPaneTheme = setScriptPaneTheme;
    setScriptPaneTheme(localStorage.getItem('jitneylogic_script_pane_theme') || 'dark');

    initAuthGate();
</script>
</body>
</html>
