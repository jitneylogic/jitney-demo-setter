<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setter Performance | RevOps Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --color-bg-dark: #223129;
        --color-box-translucent: rgba(255, 255, 255, 0.05);
        --color-sage-accent: #4C9170;
        --color-mint-soft: #8DC4AA;
        --color-highlight: #D9A441;
        --text-on-dark: #f8fafc;
        --text-muted: rgba(248, 250, 252, 0.7);
        --table-border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 30px 40px;
        font-family: 'Manrope', system-ui, -apple-system, sans-serif;
        background: var(--color-bg-dark); color: var(--text-on-dark);
    }
    h1, h2 { font-family: 'Fraunces', serif; }
    header { display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid var(--color-sage-accent); padding-bottom: 14px; margin-bottom: 24px; }
    header h1 { margin: 0; font-size: 24px; color: var(--color-mint-soft); font-weight: 500; }
    .timeframe-toggle { display: flex; background: rgba(255,255,255,0.08); border-radius: 20px; padding: 3px; gap: 2px; }
    .timeframe-toggle button {
        border: none; background: transparent; color: var(--text-on-dark); padding: 7px 16px;
        border-radius: 16px; font-size: 12px; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.5px; cursor: pointer; font-family: inherit;
    }
    .timeframe-toggle button.active { background: var(--color-sage-accent); color: #fff; }

    .summary-grid { display: flex; gap: 20px; margin-bottom: 26px; }
    .summary-card {
        background: var(--color-box-translucent); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px; padding: 18px 22px; flex: 1;
    }
    .summary-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px; }
    .summary-val { font-size: 28px; font-weight: 800; color: var(--color-highlight); }

    .panel { background: var(--color-box-translucent); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 20px; margin-bottom: 22px; }
    .panel h2 { font-size: 15px; font-weight: 600; margin: 0 0 16px; color: var(--color-mint-soft); }

    .reason-bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 13px; }
    .reason-bar-label { width: 180px; flex-shrink: 0; color: var(--text-muted); }
    .reason-bar-track { flex: 1; background: rgba(0,0,0,0.2); border-radius: 4px; height: 10px; overflow: hidden; }
    .reason-bar-fill { background: var(--color-sage-accent); height: 100%; }
    .reason-bar-count { width: 36px; text-align: right; font-weight: 700; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 12px; background: rgba(0,0,0,0.15); text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; color: var(--text-muted); }
    td { padding: 10px 12px; border-bottom: 1px solid var(--table-border); }
    td.num { font-family: monospace; }

    #empty-state { text-align: center; padding: 60px 20px; opacity: 0.6; }
</style>
</head>
<body>

<header>
    <h1>Setter Performance</h1>
    <div class="timeframe-toggle">
        <button type="button" id="tf-btn-daily" onclick="setTimeframe('daily')">Today</button>
        <button type="button" id="tf-btn-weekly" onclick="setTimeframe('weekly')">This Week</button>
    </div>
</header>

<div class="summary-grid">
    <div class="summary-card">
        <div class="summary-label">Leads Submitted</div>
        <div class="summary-val" id="summary-submitted">0</div>
    </div>
    <div class="summary-card">
        <div class="summary-label">Overall Qualified Rate</div>
        <div class="summary-val" id="summary-qualified-rate">0.0%</div>
    </div>
</div>

<div class="panel">
    <h2>Unqualified Reasons</h2>
    <div id="reason-breakdown"></div>
</div>

<div class="panel">
    <h2>Per-Setter Breakdown</h2>
    <table>
        <thead>
            <tr>
                <th>Setter</th>
                <th>Submitted</th>
                <th>Qualified</th>
                <th>Unqualified</th>
                <th>Qualified Rate</th>
            </tr>
        </thead>
        <tbody id="setter-table-body">
            <tr><td colspan="5" id="empty-state">Waiting for today's activity...</td></tr>
        </tbody>
    </table>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://jitneylogic.github.io/jitney-demo-setter/jitneylogic-engine-setter.js?v=4"></script>
<script>
    window.JITNEYLOGIC_CONFIG = {
        clientId: "demo-pest-co",
        firebaseConfig: {
            apiKey: "AIzaSyDkWrGWcepdHlkzkeSGWLiIrV0Kxsul4nE",
            authDomain: "jitneylogic-beta.firebaseapp.com",
            projectId: "jitneylogic-beta",
            storageBucket: "jitneylogic-beta.firebasestorage.app",
            messagingSenderId: "889415757227",
            appId: "1:889415757227:web:9e54a600eb654bb30276ee",
            measurementId: "G-4JECF3BX6E"
        },
        businessTimezone: "America/Denver"
    };

    let currentTimeframe = 'daily';
    let unsubscribe = null;

    function setTimeframe(tf) {
        currentTimeframe = tf;
        document.getElementById('tf-btn-daily').classList.toggle('active', tf === 'daily');
        document.getElementById('tf-btn-weekly').classList.toggle('active', tf === 'weekly');
        startListening();
    }

    function renderStats(data) {
        const repBreakdown = (data && data.rep_breakdown) || {};
        const setterIds = Object.keys(repBreakdown);

        let totalSubmitted = 0, totalQualified = 0, totalUnqualified = 0;
        const reasonTotals = {};

        setterIds.forEach(id => {
            const rep = repBreakdown[id];
            totalSubmitted += rep.leads_submitted || 0;
            totalQualified += rep.leads_qualified || 0;
            totalUnqualified += rep.leads_unqualified || 0;
            const reasons = rep.unqualified_reasons || {};
            Object.keys(reasons).forEach(reason => {
                reasonTotals[reason] = (reasonTotals[reason] || 0) + reasons[reason];
            });
        });

        document.getElementById('summary-submitted').innerText = totalSubmitted;
        const qualifiedRate = totalSubmitted > 0 ? ((totalQualified / totalSubmitted) * 100).toFixed(1) : '0.0';
        document.getElementById('summary-qualified-rate').innerText = qualifiedRate + '%';

        // Reason breakdown, sorted highest first, bar width relative to the top reason
        const reasonEntries = Object.entries(reasonTotals).sort((a, b) => b[1] - a[1]);
        const maxReasonCount = reasonEntries.length ? reasonEntries[0][1] : 1;
        const reasonEl = document.getElementById('reason-breakdown');
        reasonEl.innerHTML = reasonEntries.length === 0
            ? '<div style="opacity:0.6; font-size:13px;">No unqualified leads recorded for this timeframe.</div>'
            : reasonEntries.map(([reason, count]) => `
                <div class="reason-bar-row">
                    <div class="reason-bar-label">${reason}</div>
                    <div class="reason-bar-track"><div class="reason-bar-fill" style="width:${(count / maxReasonCount) * 100}%"></div></div>
                    <div class="reason-bar-count">${count}</div>
                </div>
            `).join('');

        // Per-setter table, sorted by most submitted first
        const tbody = document.getElementById('setter-table-body');
        if (setterIds.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" id="empty-state">Waiting for activity...</td></tr>';
            return;
        }
        const sortedIds = setterIds.sort((a, b) => (repBreakdown[b].leads_submitted || 0) - (repBreakdown[a].leads_submitted || 0));
        tbody.innerHTML = sortedIds.map(id => {
            const rep = repBreakdown[id];
            const submitted = rep.leads_submitted || 0;
            const qualified = rep.leads_qualified || 0;
            const unqualified = rep.leads_unqualified || 0;
            const rate = submitted > 0 ? ((qualified / submitted) * 100).toFixed(1) : '0.0';
            return `<tr>
                <td>${rep.setter_name || 'Unknown'}</td>
                <td class="num">${submitted}</td>
                <td class="num">${qualified}</td>
                <td class="num">${unqualified}</td>
                <td class="num">${rate}%</td>
            </tr>`;
        }).join('');
    }

    function startListening() {
        if (unsubscribe) unsubscribe(); // stop the previous timeframe's listener before starting the new one
        const config = getConfig();
        const db = firebase.firestore();
        const { daily, weekly } = dateKeysForToday();
        const key = currentTimeframe === 'daily' ? daily : weekly;
        const collection = currentTimeframe === 'daily' ? 'setter_daily_stats' : 'setter_weekly_stats';

        unsubscribe = db.collection('clients').doc(config.clientId).collection(collection).doc(key)
            .onSnapshot(doc => {
                renderStats(doc.exists ? doc.data() : null);
            }, err => {
                console.error('Setter stats listener error:', err.message);
            });
    }

    window.addEventListener('DOMContentLoaded', () => {
        const config = window.JITNEYLOGIC_CONFIG;
        if (!firebase.apps.length) firebase.initializeApp(config.firebaseConfig);
        setTimeframe('daily'); // also starts the listener
    });
</script>
</body>
</html>
